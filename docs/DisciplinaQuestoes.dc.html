<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Registrar questões</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
button{cursor:pointer}
.d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.lab{font-size:13px;font-weight:600;color:#5B607A;letter-spacing:.06em;text-transform:uppercase}
.hl{background:linear-gradient(to top,#FFD84D 0,#FFD84D 38%,transparent 38%)}
.card{background:#fff;border:1px solid #E3E5F3;border-radius:16px}
.bar{height:6px;border-radius:3px;background:#E3E5F3;overflow:hidden}
.bar i{display:block;height:100%;background:#3FA66B}
.stb{width:48px;height:48px;border-radius:14px;border:1px solid #D9DCEB;background:#fff;font-size:24px;line-height:1;color:#14162B}
.fld{height:48px;border-radius:12px;border:1px solid #D9DCEB;background:#fff;padding:0 14px;font-size:16px;color:#14162B;width:100%;box-sizing:border-box}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F6FA;color:#14162B;font-family:'Figtree',system-ui,sans-serif;display:flex;flex-direction:column;padding:56px 24px 32px;gap:16px">
<div style="display:flex;justify-content:space-between;align-items:center">
<div class="d" style="font-weight:700;font-size:26px;letter-spacing:-0.02em">Registrar questões</div>
<button aria-label="Fechar" style="width:44px;height:44px;border-radius:22px;border:1px solid #D9DCEB;background:#fff;font-size:22px;line-height:1">×</button>
</div>
<div class="card" style="padding:14px 16px">
<div class="lab">Fase 1 · Básicas</div><div style="font-size:14px;color:#5B607A;margin-top:2px;line-height:1.3">Estado, Democracia, Direitos e Ciência Política</div>
<div style="font-size:16px;font-weight:600;line-height:1.3;margin-top:4px">1.1.2 Interesse público, pluralismo e conflitos distributivos.</div>
</div>
<div style="display:flex;gap:12px">
<div style="flex:1;min-width:0"><label class="lab" for="q-certas" style="display:block;margin-bottom:6px">Certas</label><input id="q-certas" class="fld" inputmode="numeric" value="1" style="height:56px;font-size:24px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums"></div><div style="flex:1;min-width:0"><label class="lab" for="q-resolvidas" style="display:block;margin-bottom:6px">Resolvidas</label><input id="q-resolvidas" class="fld" inputmode="numeric" value="2" style="height:56px;font-size:24px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums"></div>
</div>
<div class="card" style="padding:14px 16px">
<div style="display:flex;align-items:baseline;justify-content:space-between"><div class="d" style="font-weight:700;font-size:32px">50%</div><div style="font-size:14px;color:#5B607A">neste lançamento</div></div>
<div class="bar" style="margin-top:8px"><i style="width:50%"></i></div>
<div style="font-size:13px;color:#5B607A;margin-top:8px">Certas não pode superar resolvidas.</div>
</div>
<div>
<div class="lab" style="margin-bottom:6px">Data</div>
<input class="fld" value="10/10/2026" aria-label="Data do lançamento">
</div>
<div class="card" style="padding:4px 16px">
<div style="display:flex;justify-content:space-between;align-items:center;min-height:44px;border-bottom:1px solid #EEF0F7;font-size:15px"><span>10/10 · Sessão de estudo</span><span style="font-weight:600">3/3</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;min-height:44px;border-bottom:1px solid #EEF0F7;font-size:15px"><span>10/10 · Lançamento manual</span><span style="font-weight:600">1/2</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:15px"><span style="color:#5B607A">Total do tópico</span><span style="font-weight:700;color:#17603A">4/5 · 80%</span></div>
</div>
<button style="margin-top:auto;height:52px;border-radius:14px;border:none;color:#fff;font-size:16px;font-weight:600;background:{{accent}}">Salvar lançamento</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4338CA"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#4338CA' };
}
}
</script>
</body>
</html>
